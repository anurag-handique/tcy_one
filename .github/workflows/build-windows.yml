name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web App
        working-directory: frontend
        run: npm run build

      - name: Build Windows App (.exe & Portable)
        working-directory: frontend
        run: npx electron-builder --win --publish never
        env:
          CI: false
          EP_PREVENT_PUBLISH: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Cloudflare R2
        working-directory: frontend
        run: npm run upload:r2
        env:
          R2_ACCOUNT_ID: f09e497c88cd9552e02dd2e779c8e513
          R2_ACCESS_KEY_ID: 2a98e763bb06ee4675881cdf0caa1324
          R2_SECRET_ACCESS_KEY: caf91b26814c7c505a0447e02b4c127fbaf5c3509ef9686544ae04ba6b11d4e4
          R2_BUCKET_NAME: tcy-one-releases
          R2_PUBLIC_DOMAIN: https://pub-75125c1dec6e471f88324befd8b64812.r2.dev

      - name: Upload Windows Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: tcy-one-windows-installers
          path: |
            frontend/release/*.exe
            frontend/release/*.blockmap
          if-no-files-found: error
